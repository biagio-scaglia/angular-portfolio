<nav class="fixed w-full bg-gradient-to-r from-blue-900 to-blue-700 shadow-xl z-50 backdrop-blur-sm bg-opacity-90">
  <div class="max-w-7xl mx-auto px-6">
    <div class="relative flex items-center justify-between h-20">
      <div class="flex-shrink-0 flex items-center space-x-3">
        <div class="p-2 bg-blue-600 rounded-lg shadow-lg transform hover:rotate-12 transition duration-300">
          <i class="fas fa-code text-white text-xl"></i>
        </div>
        <div>
          <span class="text-2xl font-bold text-white">Biagio Scaglia</span>
          <span class="block text-xs text-blue-200 font-mono">Full Stack Developer</span>
        </div>
      </div>

      <div class="hidden md:flex items-center space-x-1">
        @for (item of navItems; track item.id) {
          <button 
            (click)="scrollTo(item.id)"
            class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all duration-300
                   {{activeSection === item.id ? 
                     'bg-blue-500 text-white shadow-md' : 
                     'text-blue-100 hover:bg-blue-600 hover:text-white'}}"
          >
            <i class="fas {{item.icon}} mr-2"></i>
            {{ item.name }}
            @if (activeSection === item.id) {
              <div class="ml-2 w-2 h-2 bg-blue-300 rounded-full animate-pulse"></div>
            }
          </button>
        }
        <a href="#" class="ml-4 px-4 py-2 bg-white text-blue-700 rounded-lg font-semibold hover:bg-blue-50 transition duration-300 flex items-center">
          <i class="fas fa-download mr-2"></i> CV
        </a>
      </div>

      <div class="md:hidden flex items-center">
        <button 
          (click)="toggleMenu()"
          class="inline-flex items-center justify-center p-2 rounded-md text-blue-200 hover:text-white hover:bg-blue-600 focus:outline-none transition duration-300"
        >
          <i class="fas {{isMenuOpen ? 'fa-times' : 'fa-bars'}} text-xl"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="md:hidden transition-all duration-500 ease-in-out overflow-hidden" 
       [class.max-h-0]="!isMenuOpen" 
       [class.max-h-screen]="isMenuOpen">
    <div class="px-2 pt-2 pb-4 space-y-1 bg-blue-800 shadow-xl">
      @for (item of navItems; track item.id) {
        <button 
          (click)="scrollTo(item.id)"
          class="flex items-center w-full px-4 py-3 text-base font-medium rounded-lg transition duration-300
                {{activeSection === item.id ? 
                  'bg-blue-600 text-white' : 
                  'text-blue-100 hover:bg-blue-700'}}"
        >
          <i class="fas {{item.icon}} mr-3 w-6 text-center"></i>
          {{ item.name }}
          @if (activeSection === item.id) {
            <i class="fas fa-chevron-right ml-auto text-blue-300 animate-bounce"></i>
          }
        </button>
      }
      <a href="#" class="block w-full px-4 py-3 mt-2 text-center bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-500 transition duration-300">
        <i class="fas fa-download mr-2"></i> Download CV
      </a>
    </div>
  </div>
</nav>
